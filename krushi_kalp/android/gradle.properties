# JVM memory (single entry)
org.gradle.jvmargs=-Xmx6144M -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Kotlin - MUST be true to avoid KGP warnings
android.builtInKotlin=true
android.newDsl=true

# Fix download timeouts
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.connectionTimeout=300000